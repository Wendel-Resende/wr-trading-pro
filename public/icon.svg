<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente principal do W -->
    <linearGradient id="gradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>

    <!-- Gradiente principal do R -->
    <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="50%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>

    <!-- Gradiente de profundidade/sombra -->
    <linearGradient id="gradShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0.8"/>
    </linearGradient>

    <!-- Gradiente de highlight -->
    <linearGradient id="gradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </linearGradient>

    <!-- Filtro de sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.5"/>
    </filter>

    <!-- Filtro de brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Textura de metal -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFDBFE"/>
      <stop offset="25%" style="stop-color:#60A5FA"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="75%" style="stop-color:#1D4ED8"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Background escuro com gradiente -->
  <rect width="512" height="512" fill="url(#gradShadow)"/>
  <rect width="512" height="512" fill="#0F172A"/>

  <!-- Círculo de fundo com gradiente sutil -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#metal)" stroke-width="3" opacity="0.3"/>

  <!-- Sombra projetada das letras -->
  <text x="265" y="320" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="#0F172A" opacity="0.4" transform="rotate(-5, 265, 320)">WR</text>

  <!-- LETRA W - com efeito 3D -->
  <g filter="url(#shadow)">
    <!-- Camada de profundidade -->
    <text x="75" y="295" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="#1E3A8A" transform="rotate(-5, 75, 295)">W</text>

    <!-- Camada principal -->
    <text x="70" y="290" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="url(#gradW)" transform="rotate(-5, 70, 290)">W</text>

    <!-- Highlight superior -->
    <text x="70" y="290" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="url(#gradHighlight)" transform="rotate(-5, 70, 290)">W</text>
  </g>

  <!-- LETRA R - com efeito 3D -->
  <g filter="url(#shadow)">
    <!-- Camada de profundidade -->
    <text x="290" y="310" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="#1E3A8A" transform="rotate(-3, 290, 310)">R</text>

    <!-- Camada principal -->
    <text x="285" y="305" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="url(#gradR)" transform="rotate(-3, 285, 305)">R</text>

    <!-- Highlight superior -->
    <text x="285" y="305" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="url(#gradHighlight)" transform="rotate(-3, 285, 305)">R</text>
  </g>

  <!-- Linha decorativa inferior -->
  <rect x="80" y="400" width="350" height="4" rx="2" fill="url(#metal)" opacity="0.6"/>

  <!-- Detalhe de brilho sutil no círculo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.2"/>
</svg>